# Worktree Parallel — configuration
# Copy this file to .specify/extensions/worktrees/worktree-config.yml
# to override defaults per-repo.

# Layout mode: "nested" or "sibling"
#   nested  — worktree at .worktrees/<branch>/ inside the repo (default; gitignored, self-contained)
#   sibling — worktree at ../<repo>--<branch> (IDE-friendly, one window per feature)
layout: "nested"

# Auto-create worktree after /speckit.specify without prompting.
# Set to false to get a confirmation prompt instead.
auto_create: true

# Pattern for sibling-dir names. Available placeholders: {{repo}}, {{branch}}.
sibling_pattern: "{{repo}}--{{branch}}"

# Directory name for nested layout (relative to repo root, auto-gitignored).
dotworktrees_dir: ".worktrees"

# VS Code handoff for /speckit.worktrees.specify.
#   false         — print the worktree path and let the user open it manually
#   true          — open the worktree after creation when the VS Code CLI is available
vscode_open_after_create: false

# VS Code open mode:
#   new-window    — code -n <worktree-path> (recommended)
#   reuse-window  — code -r <worktree-path> (explicit opt-in)
#   print-command — only print the command to run
vscode_open_mode: "new-window"

# The editor command itself is not configurable here. This file lives in the
# repository, so a command name read from it would let repository content decide
# what gets executed. To use another editor, set SPECIFY_WORKTREE_OPEN_CMD in
# your environment (e.g. zed, cursor, code-insiders, or an absolute path).
